root = "."
tmp_dir = "bin"
[build]
  cmd = "go build -o ./bin/exchange ./cmd/exchange"
  bin = "./bin/exchange"
  include_ext = ["go", "html", "css", "mjs", "svg"]
  exclude_dir = ["bin", ".git", "assets"]
  exclude_regex = ["_test.go"]
  delay = 500
  stop_on_error = true
[build.windows]
  cmd = "go build -o ./bin/exchange.exe ./cmd/exchange"
  bin = "./bin/exchange.exe"
